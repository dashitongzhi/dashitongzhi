<svg xmlns="http://www.w3.org/2000/svg" width="700" height="40">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#555555">
        <animate attributeName="stop-color" values="#555555;#00FF41;#00BFFF;#555555" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#888888">
        <animate attributeName="stop-color" values="#888888;#00BFFF;#FF00FF;#888888" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <text x="350" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="url(#grad2)">
    Building agents that reason and act
    <animate attributeName="opacity" values="1;1;0;0" dur="4s" repeatCount="indefinite"/>
  </text>
  <rect x="345" y="12" width="2" height="20" fill="#00FF41">
    <animate attributeName="opacity" values="1;0" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
