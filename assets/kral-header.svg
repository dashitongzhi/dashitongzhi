<svg xmlns="http://www.w3.org/2000/svg" width="800" height="90">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF41">
        <animate attributeName="stop-color" values="#00FF41;#00BFFF;#FF00FF;#FFD700;#FF4500;#00FF41" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" style="stop-color:#00BFFF">
        <animate attributeName="stop-color" values="#00BFFF;#FF00FF;#FFD700;#FF4500;#00FF41;#00BFFF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" style="stop-color:#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#FFD700;#FF4500;#00FF41;#00BFFF;#FF00FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#FF4500;#00FF41;#00BFFF;#FF00FF;#FFD700" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="400" y="65" text-anchor="middle" font-family="'Courier New', monospace" font-size="72" font-weight="bold" fill="url(#neon)" filter="url(#glow)">⚡ KRAL ⚡</text>
</svg>
