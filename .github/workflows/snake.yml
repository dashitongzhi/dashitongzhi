name: Generate Snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dashitongzhi
          outputs: |
            dist/github-snake-dark.svg?color_snake=blue&color_dots=#58a6ff,#1f6feb,#0d419d,#6e40c9,#8957e5
            dist/github-snake.svg?color_snake=green&color_dots=#39d353,#26a641,#0e4429,#006d32,#009f3f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
